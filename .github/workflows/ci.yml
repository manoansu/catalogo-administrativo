# The name for the CI Pipeline workflows
name: CI Pipeline

# In the ‘on’ instruction below, it will tell us through which trigger this workflow file will be executed.
on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
#      - 'modulos/**'
  # Enable the manual trigger through the GitHub Actions interface.
  workflow_dispatch:

jobs:
  # Job for running/execution the tests
  tests:
    name: Tests runner
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged

    # Configuration of steps for our job
    steps:
      # 1. Resource code check-out
      - uses: actions/checkout@v4.1.7
      # 2. Configure/Set up the JDK on the machine
      - name: Set up JDK@21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Run the application tests
      - name: Run application tests
#        run: gradle test  # Command to run the tests on Windows
        run: ./gradlew test --stacktrace # Command to run the tests and display logs on stacktrace on Mac and Linux environment

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.3.2
        with:
          cache-read-only: true

      - name: Build application artifact
        run: ./gradlew clean build -x check

      - name: Run integration tests
        run: ./gradlew :infrastructure:integrationTests --stacktrace --info