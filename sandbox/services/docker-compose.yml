services:

  mysql:
    container_name: adm_videos_mysql
    image: mysql:8.0.44
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: adm_videos
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - ../.docker/mysql:/var/lib/mysql
    networks:
      - adm_videos_services

  rabbit:
    container_name: adm_videos_rabbitmq
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_ERLANG_COOKIE: SWQOKODSQALRPCLNMEQG
      RABBITMQ_DEFAULT_USER: adm_videos
      RABBITMQ_DEFAULT_PASS: 123456
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - 15672:15672
      - 5672:5672
    networks:
      - adm_videos_services

  keycloak:
    container_name: adm_videos_keycloak
    image: quay.io/keycloak/keycloak:26.4.7
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin_video
      KEYCLOAK_ADMIN_PASSWORD: admin123
    command:
      - start-dev
    ports:
      - "8443:8080"
    volumes:
      - ../.docker/keycloak:/opt/keycloak/data/h2
    networks:
      - adm_videos_services

networks:
  adm_videos_services:
    external: true
