# DataSource Config
server:
  port: 0

spring:
  datasource:
#    url: jdbc:mysql://localhost:3306/adm_videos
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  # RabbitMQ Config
  rabbitmq:
    host: localhost
    port: 5672
    username: adm_videos
    password: 123456

  # JPA Config
  jpa:
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
        hibernate:
            dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: false
# Keycloak Config
keycloak:
  auth-server-url: http://localhost:8080/auth
  realm: master
  resource: admin-videos
  credentials:
    secret: test

# Google Cloud Storage Config
google:
  cloud:
    storage:
      bucket-name: test
      project-id: test
      credentials-file: test

# AMQP Queues Config
amqp:
  exchanges:
    video-events: test.video.events
  queues:
    video-events:
      queue: test.video.launched
      exchange: test.video.events
      routing-key: test.video.launched
    video-created:
      queue: test.video.created
      exchange: test.video.events
      routing-key: dummy-test-routing-key
#      routing-key: video.created.key
#      routing-key: test.video.created
    video-encoded:
      queue: test.video.encoded
      exchange: test.video.events
      routing-key: test.video.encoded